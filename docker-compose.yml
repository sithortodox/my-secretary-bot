version: '3.8'

services:
  bot:
    build: .
    container_name: telegram-autopilot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/bot.db
    logs:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"